org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft 26.2 needs Java 25; pinned here so other Gradle projects keep their own JDK.
org.gradle.java.home=/opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home

# Environment Properties
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.2
minecraft_version_range=[26.2]
neo_version=26.2.0.89

## Mod Properties
mod_id=gnvcraft
mod_name=GNV-Craft
mod_license=CC0-1.0
mod_version=1.0.0
mod_group_id=com.rileycleavenger.gnvcraft
