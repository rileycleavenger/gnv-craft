plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Dev-only tests (src/gametest); never packaged into the mod jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.gametest)

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Launches a GameTestServer, runs every HeySir gametest, then exits.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Opens a flat world, poses HeySir, saves screenshots to run/screenshots/screenshots/, then quits.
        screenshotClient {
            client()
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run/screenshots')
            systemProperty 'gnvcraft.screenshotTest', 'true'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

// On macOS, a vsynced window that's covered by other apps can block forever on buffer swap.
def screenshotOptions = file('run/screenshots/options.txt')
tasks.matching { it.name == 'runScreenshotClient' }.configureEach {
    doFirst {
        screenshotOptions.parentFile.mkdirs()
        screenshotOptions.text = "enableVsync:false\nmaxFps:60\nonboardAccessibility:false\nrenderDistance:12\nguiScale:2\npauseOnLostFocus:false\n"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Lets you type server commands (or pipe them in) when running ./gradlew runServer.
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}
